; Kinema dev: el servidor corre con PHP CLI SAPI (php artisan serve),
; donde opcache.enable_cli viene Off por defecto -> cada request
; recompilaba todo el framework (~9s). Esto lo activa manteniendo
; la validación de timestamps para que los cambios de código apliquen.
opcache.enable_cli = 1
opcache.memory_consumption = 256
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2
